whisper:
  backend: auto          # auto | faster | openai   (auto = faster-whisper if installed)
  model: base            # tiny | base | small
  language: en
audio:
  sample_rate: 16000
  baseline_window_s: 60  # rolling median window for normalization
  crowd_band_hz: [300, 3000]
video:
  sample_fps: 2
  resize_width: 320
  cut_threshold: 0.6     # histogram correlation below this = scene cut
  replay_window_s: 10
  replay_min_cuts: 3
  baseline_window_s: 60  # rolling median window for motion_z (default: audio.baseline_window_s)
keywords:                # phrase: weight  (lowercase; punctuation/hyphens are ignored, "1-0" = "1 0")
  goal: 1.0
  scores: 0.9
  scored: 0.8
  penalty: 0.8
  pointed to the spot: 0.9
  red card: 0.9
  yellow card: 0.8
  var: 0.8
  save: 0.7
  what a save: 0.9
  saved by: 0.8
  chance: 0.4
  unbelievable: 0.6
  incredible: 0.6
  off the post: 0.8
  off the underside: 0.8
  crossbar: 0.6
  equaliser: 1.0
  equalizer: 1.0
  takes the lead: 1.0
  "it's 1-0": 1.0
  "1-0": 0.9
  "0-1": 0.9
  "1-1": 0.9
  "2-0": 0.9
  "2-1": 0.9
keyword_options:
  elongation_boost: 0.5  # "goooal"
  exclamation_boost: 0.5 # "Costa scores!" (Whisper adds "!" to shouted live calls)
  repeat_boost: 0.5      # "goal goal goal" within 3 s
  spread_s: 3            # spread a hit over ±N seconds (commentary lag)
scoring:
  weights: {audio: 0.5, keywords: 0.35, video: 0.15}   # normalized to sum 1
  smooth_window_s: 5
  min_peak_distance_s: 30
  top_n: 10
  min_prominence: 0.02     # find_peaks prominence on the 0..1 score
  audio_cap: 4.0           # audio_n = clip(audio_z, 0, cap) / cap
  video_cap: 6.0           # same for video_z (video_z is clipped at 6)
  replay_lookahead_s: 30   # replay within [t, t+N] s -> replay_ahead = 1 at t (replays follow the event)
  video_mix: {replay: 0.7, video_z: 0.3}   # video_n = 0.7*replay_ahead + 0.3*video_z scaled
  gate_window_s: 10        # keyword counts fully only with a crowd spike (audio_n) within ±N s
  gate_floor: 0.3          # share of the keyword signal kept with no crowd spike (recap talk)
clips:
  pre_s: 10
  post_s: 8
classifier:
  keyword_window_s: [-5, 20]   # look for keywords from peak-5s to peak+20s
  replay_window_s: [0, 60]     # look for a replay from the peak to peak+60s
  goal_audio_z_min: 1.0        # low sanity floor: max audio z in the keyword window for "Goal"
  # "Goal" needs a confirm phrase in the keyword window, not undone by a later cancel phrase, + the audio floor.
  # Plain "goal"/"lead"/"level"/"penalty" never confirm (recaps and chance talk use them too).
  # Phrase patterns, matched on whole words of the commentary (case and punctuation ignored, "it's" = "it s"):
  #   <team> = any 1-3 words ("gives <team> the lead" = "gives Liverpool the lead", "gives them the lead")
  #   <score> = a scoreline: two numbers in a row ("1-0", "2 1", "one-nil", "two-one"; not "one-two", "4-4-2")
  #   Scorelines and "all square" need live framing ("it's 2-1", "makes it 2-1", "2-1!"); recaps quote old ones.
  #   trailing "!" = the call must be exclaimed (Whisper puts "!" on shouted calls): "scores!" but not "he scored"
  # Generic English football vocabulary, not tuned on a match.
  confirm_keywords:
    # live goal calls
    - "goal!"
    - goal goal
    - "scores!"
    - "scored!"
    - and he scores
    - "it's a goal"
    - finds the net
    - into the back of the net
    - in the back of the net
    - ripples the net
    - bulges the net
    - puts it away
    - slots it home
    - slots home
    - fires home
    - heads home
    - tucks it away
    - tucks it home
    - buries it
    # the score changes (a bare scoreline is not enough: recaps quote old results, "they lost four-nil")
    - "<score>!"
    - "it's <score>"
    - it is <score>
    - "it's now <score>"
    - makes it <score>
    - takes the lead
    - gives <team> the lead
    - puts <team> ahead
    - puts <team> in front
    - doubles <team> lead
    - extends <team> lead
    - pulls one back
    - pulls a goal back
    - gets one back
    - halves the deficit
    # equaliser
    - "equaliser!"
    - "equalizer!"
    - gets the equaliser
    - gets the equalizer
    - grabs the equaliser
    - grabs the equalizer
    - "it's the equaliser"
    - "it's the equalizer"
    - levels it
    - levels the score
    - levels the scores
    - levels things up
    - "it's all square"
    - it is all square
    - "we're all square"
    - we are all square
    - "all square!"
    - back on level terms
    - makes it level
    - "make it level!"
    # penalties, own goals
    - own goal
    - penalty converted
    - converts the penalty
    - converts from the spot
    - scores from the spot
    - scores the penalty
    # after a VAR check
    - goal stands
    - goal will stand
    - goal is given
    - goal is awarded
    - goal has been given
  # Cancel phrases (same pattern syntax): one in the keyword window undoes every confirm before it,
  # so only a confirm after the last cancel counts ("VAR is checking ... the goal stands" is a Goal).
  cancel_keywords: [disallowed, ruled out, chalked off, offside, no goal, not a goal, saved, what a save, great save,
                    denied, just wide, goes wide, fires wide, just over, over the bar, off the post, off the bar,
                    off the crossbar, hits the bar, hit the bar, hits the post, hit the post, against the post,
                    hits the crossbar, misses, wasted, var is checking, var check, checking for, under review,
                    almost an own goal, nearly an own goal]
  # Phrases that contain a cancel word but cancel nothing (a cancel inside one of these is ignored).
  cancel_exceptions: [should have saved, could have saved, "couldn't have saved", could not have saved,
                      never misses, "doesn't miss", not offside, "wasn't offside", "isn't offside",
                      was he offside, is he offside, is it offside, was it offside, is that offside,
                      was that offside, "can't be denied", "won't be denied"]
  # chance/card groups: whole words inside a keyword hit
  chance_keywords: [save, saved, chance, post, crossbar, underside]
  card_keywords: [card, penalty, foul, yellow, red, var, spot]
